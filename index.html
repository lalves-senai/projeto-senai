<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão Escolar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-md: 16px;
            --radius-sm: 8px;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2ff 0%, #f1f5f9 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--surface);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-icon {
            width: 56px;
            height: 56px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.35rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            background-color: #fafafa;
        }

        input:focus {
            background-color: var(--surface);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: var(--radius-sm);
            background-color: var(--primary);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.25);
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert-error {
            display: none;
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #fecaca;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔐</div>
            <h1>Acesso do Professor</h1>
            <p>Entre com suas credenciais para gerenciar o sistema</p>
        </div>

        <div id="alertErro" class="alert-error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="professor@escola.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" id="btnEntrar" class="btn-login">Entrar no Painel</button>
        </form>

        <div class="footer-link">
            Ainda não tem conta? <a href="painel.html?cadastro=true">Ir para o cadastro</a>
        </div>
    </div>

    <script>
        const API_LOGIN = 'http://localhost:8080/professor/login';

        // Se já estiver autenticado, redireciona direto para o painel
        if (localStorage.getItem('professorLogado')) {
            window.location.href = 'painel.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btnEntrar = document.getElementById('btnEntrar');
            const alertErro = document.getElementById('alertErro');

            const credenciais = {
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value
            };

            alertErro.style.display = 'none';
            btnEntrar.disabled = true;
            btnEntrar.textContent = 'Autenticando...';

            try {
                const response = await fetch(API_LOGIN, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credenciais)
                });

                const data = await response.json();

                if (response.status === 200) {
                    // Salva sessão simples no navegador e redireciona
                    localStorage.setItem('professorLogado', credenciais.email);
                    window.location.href = 'painel.html';
                } else {
                    alertErro.textContent = data.mensagem || 'E-mail ou senha inválidos.';
                    alertErro.style.display = 'block';
                }
            } catch (error) {
                console.error('Erro:', error);
                alertErro.textContent = 'Não foi possível conectar ao servidor. Verifique a API.';
                alertErro.style.display = 'block';
            } finally {
                btnEntrar.disabled = false;
                btnEntrar.textContent = 'Entrar no Painel';
            }
        });
    </script>
</body>

</html>
